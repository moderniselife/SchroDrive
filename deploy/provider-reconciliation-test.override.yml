# Test-only override for the provider reconciliation worker.
# Apply with the existing cinecircle-test compose file only.
services:
  schrodrive-test:
    image: schrodrive:provider-reconciliation
    environment:
      PROVIDER_RECONCILIATION_ENABLED: "true"
      PROVIDER_RECONCILIATION_RECENT_INTERVAL_MS: "60000"
      PROVIDER_RECONCILIATION_FULL_INTERVAL_MS: "86400000"
      PROVIDER_RECONCILIATION_RECENT_LIMIT: "1"
      PROVIDER_RECONCILIATION_RUN_FULL_ON_START: "false"
      PROVIDER_RECONCILIATION_DRY_RUN: "false"
      PROVIDER_RECONCILIATION_RADARR_URL: http://radarr-test:7878
      PROVIDER_RECONCILIATION_RADARR_API_KEY: ${CINECIRCLE_RADARR_API_KEY:-}
      PROVIDER_RECONCILIATION_SONARR_URL: http://sonarr-test:8989
      PROVIDER_RECONCILIATION_SONARR_API_KEY: ${CINECIRCLE_SONARR_API_KEY:-}
      PROVIDER_RECONCILIATION_MOUNT_BASE: /mnt/schrodrive
      PROVIDER_RECONCILIATION_MOVIES_LIBRARY_PATH: /mnt/cinecircle-test/radarr/movies
      PROVIDER_RECONCILIATION_SHOWS_LIBRARY_PATH: /mnt/cinecircle-test/sonarr/shows
      ALLDEBRID_API_KEY: ${ALLDEBRID_API_KEY:-}
      # Direct provider polling is the only input under test here.
      RUN_WEBHOOK: "false"
      RUN_POLLER: "false"
      RUN_WATCHLIST_POLLER: "false"
      RUN_DEAD_SCANNER: "false"
      RUN_DEAD_SCANNER_WATCH: "false"
      ENABLE_REPAIR: "false"
      PREEMPTIVE_REPAIR: "false"
      RUN_ORGANIZER_WATCH: "false"
    volumes:
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        bind:
          propagation: rshared
      - type: bind
        source: /home/samtruman/cinecircle-test-clean/schrodrive/data
        target: /data
      - type: bind
        source: /home/samtruman/cinecircle-test-clean/schrodrive/config
        target: /config
      - type: bind
        source: /home/samtruman/cinecircle-test-clean
        target: /mnt/cinecircle-test

  radarr-test:
    volumes:
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/radarr/config
        target: /config
      - type: bind
        source: /home/samtruman/docker/cinecircle-test
        target: /mnt/cinecircle-test
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive/downloads
        target: /mnt/schrodrive/downloads

  sonarr-test:
    volumes:
      - type: bind
        source: /home/samtruman/cinecircle-test-clean/sonarr/config
        target: /config
      - type: bind
        source: /home/samtruman/cinecircle-test-clean
        target: /mnt/cinecircle-test
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive/downloads
        target: /mnt/schrodrive/downloads
