# Test-only override for the CineCircle AllDebrid reconciliation worker.
# Apply with the existing cinecircle-test compose file only.
services:
  schrodrive-test:
    image: schrodrive:cinecircle-alldebrid-reconciliation
    environment:
      CINECIRCLE_ALLDEBRID_RECONCILIATION_ENABLED: "true"
      CINECIRCLE_ALLDEBRID_RECENT_INTERVAL_MS: "60000"
      CINECIRCLE_ALLDEBRID_FULL_INTERVAL_MS: "300000"
      CINECIRCLE_ALLDEBRID_RECENT_LIMIT: "30"
      CINECIRCLE_ALLDEBRID_DRY_RUN: "false"
      CINECIRCLE_RADARR_URL: http://radarr-test:7878
      CINECIRCLE_RADARR_API_KEY: ${CINECIRCLE_RADARR_API_KEY:-}
      CINECIRCLE_SONARR_URL: http://sonarr-test:8989
      CINECIRCLE_SONARR_API_KEY: ${CINECIRCLE_SONARR_API_KEY:-}
      ALLDEBRID_API_KEY: ${ALLDEBRID_API_KEY:-}
      # Direct AllDebrid polling is the only input under test here.
      RUN_WEBHOOK: "false"
      RUN_POLLER: "false"
      RUN_WATCHLIST_POLLER: "false"
      RUN_DEAD_SCANNER: "false"
      RUN_DEAD_SCANNER_WATCH: "false"
      ENABLE_REPAIR: "false"
      PREEMPTIVE_REPAIR: "false"
      RUN_ORGANIZER_WATCH: "false"
    volumes:
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        bind:
          propagation: rshared

  radarr-test:
    volumes:
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/radarr/config
        target: /config
      - type: bind
        source: /home/samtruman/docker/cinecircle-test
        target: /mnt/cinecircle-test
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive/downloads
        target: /mnt/schrodrive/downloads

  sonarr-test:
    volumes:
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/sonarr/config
        target: /config
      - type: bind
        source: /home/samtruman/docker/cinecircle-test
        target: /mnt/cinecircle-test
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive
        target: /mnt/schrodrive
        read_only: true
        bind:
          propagation: rslave
      - type: bind
        source: /home/samtruman/docker/cinecircle-test/schrodrive/downloads
        target: /mnt/schrodrive/downloads
