name: Guard

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to check for leaked files in past commits

      - name: Check .gitignore protects runtime databases
        run: |
          echo "==> Checking .gitignore contains required DB ignore rules..."
          missing=0
          for pattern in "data/*.db" "*.db-shm" "*.db-wal" "*.db-journal" "*.db"; do
            if ! grep -qF "$pattern" .gitignore; then
              echo "::error::.gitignore is missing required pattern: $pattern"
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "Fix: add the missing patterns to .gitignore (see chore: ignore runtime SQLite databases)"
            exit 1
          fi
          echo "✓ .gitignore OK"

      - name: Fail if any .db files are tracked
        run: |
          echo "==> Checking for tracked *.db files (should be zero)..."
          # git ls-files respects .gitignore, so any match here is a violation
          if git ls-files | grep -Eq '\.db$|\.db-shm$|\.db-wal$|\.db-journal$'; then
            echo "::error::Prohibited runtime DB files are tracked in git!"
            echo "Tracked offending files:"
            git ls-files | grep -E '\.db($|-shm$|-wal$|-journal$)'
            echo ""
            echo "Fix: git rm --cached <file> and ensure .gitignore covers it."
            echo "See: CONTRIBUTING.md § Ground Rules – No secrets in commits"
            exit 1
          fi
          echo "✓ No tracked .db files"

      - name: Fail if .env files are tracked (except .env.example)
        run: |
          echo "==> Checking for tracked .env files..."
          # Allow .env.example, forbid everything else
          if git ls-files | grep -Eq '(^|/)\.env($|\.)' | grep -vE '\.env\.example$'; then
            echo "::error::.env files must never be committed (use .env.example)"
            git ls-files | grep -E '(^|/)\.env'
            exit 1
          fi
          echo "✓ No tracked .env files"

      - name: Fail if history still contains leaked DBs
        run: |
          echo "==> Checking PR history for leaked DBs (catches contributors with stale history)..."
          # Only check commits introduced by this PR/branch vs the base branch.
          # Using --all would flag origin/main which is still protected and retains old history until an admin purges it.
          BASE_REF="${{ github.base_ref || 'develop' }}"
          # Ensure base exists locally (checkout with fetch-depth:0 guarantees it, but be defensive)
          git fetch origin "$BASE_REF" --depth=1 2>/dev/null || git fetch origin 2>/dev/null || true
          # Determine merge-base; fall back to origin/develop if BASE_REF not found
          if git rev-parse --verify "origin/$BASE_REF" >/dev/null 2>&1; then
            BASE="origin/$BASE_REF"
          else
            BASE="origin/develop"
          fi
          # Also handle push events where base_ref is empty – compare against HEAD~1 or just tracked files
          if [ "${{ github.event_name }}" = "push" ]; then
            # For pushes, just check the range of new commits (before..after)
            RANGE="${{ github.event.before }}..${{ github.event.after }}"
            # If before is all zeros (new branch), use base
            if echo "$RANGE" | grep -q "0\{40\}"; then
              RANGE="$BASE..HEAD"
            fi
          else
            RANGE="$BASE..HEAD"
          fi
          echo "Checking range: $RANGE (base: $BASE)"
          # Collect added files in the range (diff-filter=A) – deletions of old DBs are expected and should not fail
          if git rev-parse --verify HEAD >/dev/null 2>&1 && git rev-parse --verify "$BASE" >/dev/null 2>&1; then
            CHANGED=$(git diff --name-only --diff-filter=A "$BASE"...HEAD 2>/dev/null | sort -u || true)
            if [ -z "$CHANGED" ]; then
              CHANGED=$(git log --diff-filter=A --name-only --pretty=format: "$RANGE" 2>/dev/null | sort -u || true)
            fi
          else
            CHANGED=$(git diff --name-only --diff-filter=A HEAD 2>/dev/null || true)
          fi
          if echo "$CHANGED" | grep -Eq '\.db$|\.db-shm$|\.db-wal$'; then
            echo "::error::This PR introduces runtime DB files! Your branch adds a .db."
            echo "Offending added files in PR range:"
            echo "$CHANGED" | grep -E '\.db($|-shm$|-wal$)'
            echo ""
            echo "Fix: remove the .db from the PR and ensure .gitignore covers it:"
            echo "  git rm --cached <file>"
            echo "  # If your branch is based on pre-scrub history, rebase:"
            echo "  git fetch origin && git rebase origin/develop"
            exit 1
          fi
          echo "✓ PR history clean (no added .db files)"

      - name: Scan for unexpected data/ content
        run: |
          echo "==> Checking data/ directory content..."
          # Only .gitkeep should be tracked in data/
          tracked_data=$(git ls-files -- data/ || true)
          echo "Tracked in data/:"
          echo "$tracked_data"
          if [ -z "$tracked_data" ]; then
            echo "::error::data/ should contain at least data/.gitkeep"
            exit 1
          fi
          allowed="^data/\.gitkeep$"
          bad=$(echo "$tracked_data" | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "::error::Unexpected files tracked in data/ (only .gitkeep allowed):"
            echo "$bad"
            exit 1
          fi
          echo "✓ data/ OK"

      - name: Summary
        run: echo "✅ Guard passed – no leaked DBs, .env, or history contamination"
